site_name: Odyssey
site_description: Odometry and motion control template for VEX V5 (PROS)
site_url: https://jonahchang207.github.io/odyssey/
repo_url: https://github.com/jonahchang207/odyssey
repo_name: odyssey

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jonahchang207/odyssey
      name: Odyssey on GitHub

copyright: Copyright &copy; 2026 Jonah Chang · MIT License

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Hardware Setup: getting-started/hardware.md
      - Configuration: getting-started/configuration.md
      - The Coordinate System: getting-started/coordinates.md
      - Your First Autonomous: getting-started/first-autonomous.md
  - Tutorials:
      - Tuning the PIDs: tutorials/tuning.md
      - Driver Control: tutorials/driver-control.md
      - Pure Pursuit Paths: tutorials/pure-pursuit.md
      - Team Workflow & CLI: tutorials/workflow.md
  - How It Works:
      - The Odometry Math: explanation/odometry-math.md
      - Monte Carlo Localization: explanation/monte-carlo-localization.md
  - API Reference:
      - Chassis: api/chassis.md
      - Odometry: api/odometry.md
      - Localization: api/localization.md
      - Helpers: api/helpers.md
