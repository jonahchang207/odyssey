<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Odyssey field coordinate system</title>
  <desc id="desc">A top-down field with positive y pointing away from the driver station and positive x pointing right. Compass headings increase clockwise: zero degrees up-field, 90 right, 180 toward the drivers, and 270 left.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#423522" stroke-width="1"/></pattern>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e0b54e"/></marker>
    <marker id="arrowCopper" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d28a4d"/></marker>
    <style>.axis{stroke-width:5;marker-end:url(#arrowGold)}.heading{fill:none;stroke:#d28a4d;stroke-width:4;marker-end:url(#arrowCopper)}.title{fill:#f1e3c5;font:700 23px 'Segoe UI',sans-serif}.label{fill:#e0b54e;font:700 20px 'Cascadia Code',monospace}.muted{fill:#b8a588;font:16px 'Segoe UI',sans-serif}.degree{fill:#f1e3c5;font:700 17px 'Segoe UI',sans-serif}</style>
  </defs>
  <rect width="900" height="600" rx="24" fill="#15110d"/>
  <rect x="180" y="65" width="540" height="470" rx="12" fill="url(#grid)" stroke="#8a6420" stroke-width="3"/>
  <text x="450" y="35" class="muted" text-anchor="middle">AWAY FROM DRIVER STATION</text>
  <rect x="328" y="552" width="244" height="28" rx="8" fill="#49311b" stroke="#b87333"/><text x="450" y="572" class="muted" text-anchor="middle">DRIVER STATION</text>
  <line x1="450" y1="300" x2="450" y2="104" stroke="#e0b54e" class="axis"/>
  <line x1="450" y1="300" x2="665" y2="300" stroke="#e0b54e" class="axis"/>
  <text x="470" y="120" class="label">+y</text><text x="620" y="285" class="label">+x</text>
  <circle cx="450" cy="300" r="72" fill="#241b12" stroke="#b87333" stroke-width="3"/>
  <path d="M450 347 418 278 450 259 482 278Z" fill="#c9972c" stroke="#f2d27e" stroke-width="2"/>
  <circle cx="450" cy="300" r="7" fill="#15110d"/>
  <path class="heading" d="M395 254A72 72 0 0 1 501 254"/>
  <text x="450" y="85" class="degree" text-anchor="middle">0°</text>
  <text x="690" y="307" class="degree">90°</text>
  <text x="450" y="520" class="degree" text-anchor="middle">180°</text>
  <text x="210" y="307" class="degree">270°</text>
  <text x="450" y="398" class="muted" text-anchor="middle">clockwise is positive</text>
  <text x="200" y="105" class="title">Pose = (x, y, heading)</text>
</svg>
