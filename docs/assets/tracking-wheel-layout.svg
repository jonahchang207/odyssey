<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Tracking wheel orientation and offset signs</title>
  <desc id="desc">Top-down robot diagram. Vertical tracking wheels measure forward travel and have negative offsets on the left and positive offsets on the right. Horizontal wheels measure sideways travel and have negative offsets behind center and positive offsets in front.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#e0b54e"/></marker>
    <style>.body{fill:#292016;stroke:#8a6420;stroke-width:3}.drive{fill:#0f0d0a;stroke:#6f5b3b;stroke-width:3}.track{fill:#c9972c;stroke:#f0cc73;stroke-width:2}.center{stroke:#b87333;stroke-width:2;stroke-dasharray:7 6}.measure{stroke:#e0b54e;stroke-width:4;marker-end:url(#arrow)}.title{fill:#f1e3c5;font:700 23px 'Segoe UI',sans-serif}.label{fill:#f1e3c5;font:17px 'Segoe UI',sans-serif}.code{fill:#e0b54e;font:700 17px 'Cascadia Code',monospace}.muted{fill:#b8a588;font:15px 'Segoe UI',sans-serif}</style>
  </defs>
  <rect width="960" height="600" rx="24" fill="#15110d"/>
  <text x="480" y="46" class="title" text-anchor="middle">Top-down sensor layout</text>
  <rect class="body" x="300" y="100" width="360" height="420" rx="45"/>
  <rect class="drive" x="265" y="150" width="50" height="130" rx="20"/><rect class="drive" x="645" y="150" width="50" height="130" rx="20"/>
  <rect class="drive" x="265" y="340" width="50" height="130" rx="20"/><rect class="drive" x="645" y="340" width="50" height="130" rx="20"/>
  <line class="center" x1="480" y1="82" x2="480" y2="540"/><line class="center" x1="280" y1="310" x2="680" y2="310"/>
  <circle cx="480" cy="310" r="9" fill="#d28a4d"/><text x="495" y="335" class="muted">tracking center</text>
  <rect class="track" x="382" y="225" width="20" height="76" rx="8"/><rect class="track" x="558" y="225" width="20" height="76" rx="8"/>
  <rect class="track" x="491" y="184" width="76" height="20" rx="8"/><rect class="track" x="491" y="416" width="76" height="20" rx="8"/>
  <line class="measure" x1="392" y1="218" x2="392" y2="150"/><line class="measure" x1="568" y1="218" x2="568" y2="150"/>
  <line class="measure" x1="575" y1="194" x2="635" y2="194"/><line class="measure" x1="575" y1="426" x2="635" y2="426"/>
  <text x="46" y="145" class="title">Vertical wheels</text><text x="46" y="177" class="label">measure forward travel</text><text x="46" y="210" class="code">left = negative</text><text x="46" y="238" class="code">right = positive</text>
  <path d="M250 220H340L382 250" fill="none" stroke="#8a6420" stroke-width="2"/>
  <text x="710" y="350" class="title">Horizontal wheels</text><text x="710" y="382" class="label">measure sideways travel</text><text x="710" y="415" class="code">behind = negative</text><text x="710" y="443" class="code">front = positive</text>
  <path d="M700 400H650L567 426" fill="none" stroke="#8a6420" stroke-width="2"/>
  <text x="480" y="82" class="code" text-anchor="middle">FRONT</text>
  <text x="480" y="570" class="muted" text-anchor="middle">Offsets are signed distances from the tracking center</text>
</svg>
